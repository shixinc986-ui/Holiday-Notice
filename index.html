<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026圣诞—2027新年 假期收货与值班安排公告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            padding: 0;
            margin: 0;
        }

        .schedule-box {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 10px;
        }

        .schedule-box img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div class="schedule-box">
        <img
            id="scheduleImg"
            src="./schedule.png"
            alt="2026圣诞—2027新年 仓库值班及物流收货排班公告"
            decoding="async"
        >
    </div>

    <script>
        const img = document.getElementById('scheduleImg');
        img.addEventListener('load', function () {
            const maxWidth = 1200;
            if (img.naturalWidth > maxWidth) {
                img.style.width = maxWidth + 'px';
                img.style.maxWidth = '100%';
            }
        });
    </script>
</body>
</html>
